<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <style>
      body {
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: block;
      }
      #fps {
          position: fixed;      /* stays in the corner, on top of the canvas */
          top: 8px;
          left: 8px;
          padding: 4px 8px;
          font: 14px monospace;
          color: white;
          background: rgba(0, 0, 0, 0.5);   /* semi-transparent black box */
          border-radius: 4px;
          pointer-events: none; /* clicks go through it to the game (for mouse lock) */
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="fps">FPS: --</div>
    <script type="importmap">
      {
        "imports": {
          "gl-matrix": "/node_modules/gl-matrix/esm/index.js"
        }
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
