<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas id="canvas"></canvas>
        <div id="start-screen">
      <div id="menu">
        <div class="menu-title">MAIN MENU</div>

        <button id="play-button" class="menu-item" disabled>Nalaganje…</button>

        <div class="menu-title menu-title-small">KONTROLE</div>
        <div class="menu-row"><span>W A S D</span><span>premikanje</span></div>
        <div class="menu-row"><span>SHIFT</span><span>tek</span></div>
        <div class="menu-row"><span>SPACE</span><span>skok</span></div>
        <div class="menu-row"><span>MIŠKA</span><span>razgled</span></div>
        <div class="menu-row"><span>ESC</span><span>sprosti miško</span></div>
      </div>

      <div id="menu-hint">ENTER / KLIK &nbsp;Start</div>
    </div>
        <div id="end-screen">
      <div id="end-card">
        <h1 id="end-title">KONEC IGRE</h1>
        <p id="end-text"></p>
        <button id="restart-button" class="menu-item">IGRAJ ZNOVA</button>
      </div>
    </div>
    <div id="fps">FPS: --</div>
    <div id="tokens">Žetoni: 0 / 16</div>
    <div id="timer">Čas: 00:00</div>
    <script type="importmap">
      {
        "imports": {
          "gl-matrix": "/node_modules/gl-matrix/esm/index.js"
        }
      }
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
